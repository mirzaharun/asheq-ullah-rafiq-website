<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অ্যাডমিন প্যানেল | আশেক উল্লাহ রফিক</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f2;color:#17251d;font-family:'Hind Siliguri',sans-serif;line-height:1.6}.shell{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel{background:white;border:1px solid #dce5dd;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 8px 24px #1020180a}h1,h2{margin:0 0 12px}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea{width:100%;padding:11px;border:1px solid #cbd7ce;border-radius:8px;font:inherit}textarea{min-height:90px}button,.btn{border:0;background:#0f6b35;color:white;padding:10px 17px;border-radius:8px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block;margin:6px 4px 0 0}button.secondary{background:#58675f}button.danger{background:#b42335}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.hidden{display:none!important}.item{padding:12px;border:1px solid #dce5dd;border-radius:10px;margin:8px 0}.muted{color:#64736a}.status{padding:10px;border-radius:8px;background:#eef6ef;margin:12px 0;white-space:pre-wrap}small{color:#66756c}</style></head><body><main class="shell"><div class="top"><div><h1>অ্যাডমিন প্যানেল</h1><div class="muted">আশেক উল্লাহ রফিক — ওয়েবসাইট ব্যবস্থাপনা</div></div><a class="btn" href="./index.html">ওয়েবসাইট দেখুন</a></div><section id="login" class="panel"><h2>অ্যাডমিন লগইন</h2><label>ইমেইল</label><input id="email" type="email" autocomplete="username"><label>পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">লগইন</button><p class="muted">Firebase Authentication-এ আগে থেকে তৈরি করা Admin Email/Password ব্যবহার করুন।</p></section><section id="app" class="hidden"><div class="panel"><div class="top"><h2>ওয়েবসাইটের পরিচিতি সম্পাদনা</h2><button class="secondary" id="logoutBtn">লগআউট</button></div><div class="grid" id="fields"></div><button id="saveContent">পরিবর্তন সংরক্ষণ করুন</button><div id="contentStatus" class="status" aria-live="polite"></div></div><div class="panel"><h2>নতুন আপডেট প্রকাশ</h2><label>শিরোনাম</label><input id="postTitle" placeholder="আপডেটের শিরোনাম"><label>বিস্তারিত</label><textarea id="postBody" placeholder="আপডেটের বিবরণ"></textarea><button id="addPost">প্রকাশ করুন</button><div id="postStatus" class="status" aria-live="polite"></div></div><div class="panel"><h2>প্রকাশিত আপডেট</h2><div id="posts"></div></div></section></main><script type="module" src="./js/admin.js"></script></body></html>
